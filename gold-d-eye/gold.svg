<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8956F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DA7756;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#goldGrad)"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="white" stroke-width="5"/>
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="white" stroke-width="4"/>
  <!-- Center dot (pupil) -->
  <circle cx="50" cy="50" r="6" fill="white"/>
</svg>
